<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#030712" />
    <title>Silver Star Staff — Employee Mobile</title>
    <style>
      :root {
        color-scheme: dark;
        background-color: #030712;
      }
      html, body {
        background-color: #030712;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      #root:empty {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 30%, #162363 0%, #030712 75%);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      }
      #root:empty::before {
        content: "";
        width: 68px;
        height: 68px;
        border-radius: 20px;
        background: #ffffff url('/silverstar-icon-512.png') center/contain no-repeat;
        box-shadow: 0 10px 30px rgba(38, 188, 238, 0.35);
        animation: pulseLogo 1.4s ease-in-out infinite alternate;
      }
      #root:empty::after {
        content: "Silver Star One";
        margin-top: 18px;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.05em;
        color: #f8fafc;
        opacity: 0.9;
      }
      @keyframes pulseLogo {
        from { transform: scale(0.96); opacity: 0.85; }
        to { transform: scale(1.04); opacity: 1; }
      }
    </style>
  </head>
  <body class="bg-slate-950 antialiased selection:bg-[#26BCEE]/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
