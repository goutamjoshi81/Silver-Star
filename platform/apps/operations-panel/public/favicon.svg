<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38C6F4"/>
      <stop offset="50%" stop-color="#18AEE5"/>
      <stop offset="100%" stop-color="#0E8EC0"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22338A"/>
      <stop offset="100%" stop-color="#121D54"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Oval Swirling Emblem -->
  <g transform="translate(15, 10)">
    <!-- Navy Right Crescent / Body -->
    <path d="M 95,8 C 135,16 160,48 160,85 C 160,125 130,156 90,160 C 105,145 115,120 115,85 C 115,50 105,25 95,8 Z" 
          fill="url(#navyGrad)" />

    <!-- Center White Swirl Divider -->
    <path d="M 68,160 C 95,152 110,122 110,85 C 110,48 95,20 72,10 C 85,22 92,48 92,85 C 92,122 83,148 68,160 Z" 
          fill="#FFFFFF" />

    <!-- Left Cyan Waves (Intertwined S Curves) -->
    <path d="M 65,10 C 30,15 10,45 10,85 C 10,125 35,155 70,160 C 45,150 32,125 32,85 C 32,45 45,22 65,10 Z" 
          fill="url(#cyanGrad)" />

    <path d="M 72,10 C 50,22 38,48 38,85 C 38,122 52,148 70,160 C 58,148 48,122 48,85 C 48,48 58,22 72,10 Z" 
          fill="#FFFFFF" opacity="0.95" />

    <path d="M 90,8 C 72,25 60,52 60,85 C 60,118 70,145 88,160 C 78,148 68,122 68,85 C 68,48 78,22 90,8 Z" 
          fill="url(#cyanGrad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(195, 20)">
    <!-- "Silver" in Bold Cyan Serif -->
    <text x="0" y="80" 
          font-family="'Playfair Display', 'Times New Roman', Georgia, serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="-1" 
          fill="url(#cyanGrad)">Silver</text>

    <!-- "Star" in Bold Deep Navy Serif -->
    <text x="182" y="80" 
          font-family="'Playfair Display', 'Times New Roman', Georgia, serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="-1" 
          fill="url(#navyGrad)">Star</text>

    <!-- Tagline: "Your True Business Partners" -->
    <text x="5" y="116" 
          font-family="'Inter', 'Montserrat', -apple-system, sans-serif" 
          font-size="16.5" 
          font-weight="600" 
          letter-spacing="1.8" 
          fill="#334155" 
          text-transform="capitalize">Your True Business Partners</text>
  </g>
</svg>