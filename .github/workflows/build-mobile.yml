name: Build Mobile App (Android APK & iOS IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'platform/apps/employee-mobile/**'
      - '.github/workflows/build-mobile.yml'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'platform/apps/employee-mobile/package-lock.json'

      - name: Install Dependencies
        run: |
          cd platform/apps/employee-mobile
          npm ci

      - name: Build Web Assets
        run: |
          cd platform/apps/employee-mobile
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd platform/apps/employee-mobile
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd platform/apps/employee-mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SilverStar-Android-Debug-APK
          path: platform/apps/employee-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'platform/apps/employee-mobile/package-lock.json'

      - name: Install Dependencies
        run: |
          cd platform/apps/employee-mobile
          npm ci

      - name: Build Web Assets
        run: |
          cd platform/apps/employee-mobile
          npm run build

      - name: Sync Capacitor iOS
        run: |
          cd platform/apps/employee-mobile
          npx cap sync ios

      - name: Build iOS Archive (Unsigned)
        run: |
          cd platform/apps/employee-mobile/ios/App
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SilverStar.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload to IPA
        run: |
          cd platform/apps/employee-mobile/ios/App/build
          mkdir -p Payload
          cp -r SilverStar.xcarchive/Products/Applications/App.app Payload/
          zip -qr SilverStar-iOS.ipa Payload

      - name: Upload iOS IPA & Archive
        uses: actions/upload-artifact@v4
        with:
          name: SilverStar-iOS-Package
          path: |
            platform/apps/employee-mobile/ios/App/build/SilverStar-iOS.ipa
            platform/apps/employee-mobile/ios/App/build/SilverStar.xcarchive
          if-no-files-found: error
          retention-days: 14

